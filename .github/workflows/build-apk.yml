name: Build Movie Recap AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android Project Directories
        run: |
          mkdir -p app/src/main/java/com/example/movierecap
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

      - name: Create Root Gradle Files
        run: |
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
          echo "rootProject.name = 'MovieRecapAI'" >> settings.gradle
          echo "include ':app'" >> settings.gradle

          echo "plugins { id 'com.android.application' version '8.1.0' apply false }" > build.gradle

      - name: Create App Build Gradle
        run: |
          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android {" >> app/build.gradle
          echo "    namespace 'com.example.movierecap'" >> app/build.gradle
          echo "    compileSdk 33" >> app/build.gradle
          echo "    defaultConfig {" >> app/build.gradle
          echo "        applicationId 'com.example.movierecap'" >> app/build.gradle
          echo "        minSdk 21" >> app/build.gradle
          echo "        targetSdk 33" >> app/build.gradle
          echo "        versionCode 1" >> app/build.gradle
          echo "        versionName '1.0'" >> app/build.gradle
          echo "    }" >> app/build.gradle
          echo "}" >> app/build.gradle
          echo "dependencies {" >> app/build.gradle
          echo "    implementation 'androidx.appcompat:appcompat:1.6.1'" >> app/build.gradle
          echo "    implementation 'com.google.android.material:material:1.9.0'" >> app/build.gradle
          echo "}" >> app/build.gradle

      - name: Create Resources and Manifest
        run: |
          echo '<resources><style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar"/></resources>' > app/src/main/res/values/styles.xml

          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' > app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.INTERNET" />' >> app/src/main/AndroidManifest.xml
          echo '    <application android:theme="@style/AppTheme" android:label="Movie Recap AI">' >> app/src/main/AndroidManifest.xml
          echo '        <activity android:name=".MainActivity" android:exported="true">' >> app/src/main/AndroidManifest.xml
          echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
          echo '                <action android:name="android.intent.action.MAIN" />' >> app/src/main/AndroidManifest.xml
          echo '                <category android:name="android.intent.category.LAUNCHER" />' >> app/src/main/AndroidManifest.xml
          echo '            </intent-filter>' >> app/src/main/AndroidManifest.xml
          echo '        </activity>' >> app/src/main/AndroidManifest.xml
          echo '    </application>' >> app/src/main/AndroidManifest.xml
          echo '</manifest>' >> app/src/main/AndroidManifest.xml

      - name: Create Layout XML
        run: |
          echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/res/layout/activity_main.xml
          echo '<ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#121212" android:padding="16dp">' >> app/src/main/res/layout/activity_main.xml
          echo '    <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">' >> app/src/main/res/layout/activity_main.xml
          echo '        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Movie Recap AI" android:textColor="#FFFFFF" android:textSize="24sp" android:textStyle="bold" android:layout_gravity="center" android:layout_marginBottom="16dp"/>' >> app/src/main/res/layout/activity_main.xml
          echo '        <EditText android:id="@+id/etApiKey" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Gemini API Key" android:textColorHint="#888888" android:textColor="#FFFFFF" android:inputType="textPassword" android:background="#222222" android:padding="12dp" android:layout_marginBottom="12dp"/>' >> app/src/main/res/layout/activity_main.xml
          echo '        <EditText android:id="@+id/etMovieName" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Movie Name" android:textColorHint="#888888" android:textColor="#FFFFFF" android:background="#222222" android:padding="12dp" android:layout_marginBottom="16dp"/>' >> app/src/main/res/layout/activity_main.xml
          echo '        <Button android:id="@+id/btnGenerate" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Generate Recap"/>' >> app/src/main/res/layout/activity_main.xml
          echo '        <ProgressBar android:id="@+id/progressBar" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="center" android:visibility="gone" android:layout_margin="16dp"/>' >> app/src/main/res/layout/activity_main.xml
          echo '        <TextView android:id="@+id/tvResult" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#EEEEEE" android:textSize="16sp" android:layout_marginTop="16dp"/>' >> app/src/main/res/layout/activity_main.xml
          echo '    </LinearLayout>' >> app/src/main/res/layout/activity_main.xml
          echo '</ScrollView>' >> app/src/main/res/layout/activity_main.xml

      - name: Create Java Source Code
        run: |
          cat << 'EOF' > app/src/main/java/com/example/movierecap/MainActivity.java
          package com.example.movierecap;

          import androidx.appcompat.app.AppCompatActivity;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends AppCompatActivity {

              private EditText etApiKey, etMovieName;
              private Button btnGenerate;
              private ProgressBar progressBar;
              private TextView tvResult;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  etApiKey = findViewById(R.id.etApiKey);
                  etMovieName = findViewById(R.id.etMovieName);
                  btnGenerate = findViewById(R.id.btnGenerate);
                  progressBar = findViewById(R.id.progressBar);
                  tvResult = findViewById(R.id.tvResult);

                  btnGenerate.setOnClickListener(v -> generateRecap());
              }

              private void generateRecap() {
                  String apiKey = etApiKey.getText().toString().trim();
                  String movieName = etMovieName.getText().toString().trim();

                  if (apiKey.isEmpty() || movieName.isEmpty()) {
                      Toast.makeText(this, "Please enter API Key and Movie Name", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  progressBar.setVisibility(View.VISIBLE);
                  tvResult.setText("");
                  btnGenerate.setEnabled(false);

                  new Thread(() -> {
                      try {
                          String urlString = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + apiKey;
                          URL url = new URL(urlString);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json");
                          conn.setDoOutput(true);

                          String promptText = "Write a movie recap and summary in Burmese language for: " + movieName;

                          JSONObject textPart = new JSONObject();
                          textPart.put("text", promptText);

                          JSONArray partsArray = new JSONArray();
                          partsArray.put(textPart);

                          JSONObject contentObj = new JSONObject();
                          contentObj.put("parts", partsArray);

                          JSONArray contentsArray = new JSONArray();
                          contentsArray.put(contentObj);

                          JSONObject jsonBody = new JSONObject();
                          jsonBody.put("contents", contentsArray);

                          OutputStream os = conn.getOutputStream();
                          os.write(jsonBody.toString().getBytes("UTF-8"));
                          os.close();

                          int responseCode = conn.getResponseCode();
                          if (responseCode == HttpURLConnection.HTTP_OK) {
                              BufferedReader in = new BufferedReader(new InputStreamReader(conn.getInputStream(), "UTF-8"));
                              StringBuilder response = new StringBuilder();
                              String inputLine;
                              while ((inputLine = in.readLine()) != null) {
                                  response.append(inputLine);
                              }
                              in.close();

                              JSONObject jsonResponse = new JSONObject(response.toString());
                              JSONArray candidates = jsonResponse.getJSONArray("candidates");
                              JSONObject firstCandidate = candidates.getJSONObject(0);
                              JSONObject content = firstCandidate.getJSONObject("content");
                              JSONArray parts = content.getJSONArray("parts");
                              String resultText = parts.getJSONObject(0).getString("text");

                              runOnUiThread(() -> {
                                  progressBar.setVisibility(View.GONE);
                                  btnGenerate.setEnabled(true);
                                  tvResult.setText(resultText);
                              });
                          } else {
                              runOnUiThread(() -> {
                                  progressBar.setVisibility(View.GONE);
                                  btnGenerate.setEnabled(true);
                                  tvResult.setText("Error Code: " + responseCode + ". Check your API Key.");
                              });
                          }

                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              progressBar.setVisibility(View.GONE);
                              btnGenerate.setEnabled(true);
                              tvResult.setText("Error: " + e.getMessage());
                          });
                      }
                  }).start();
              }
          }
          EOF

      - name: Setup Gradle Wrapper and Build APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: movie-recap-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
